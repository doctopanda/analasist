name: POPIS 4.3 CI

on:
  pull_request:
    paths:
      - 'POPIS_4_0/**'
      - '.github/workflows/popis4-ci.yml'
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test dependencies
        run: python -m pip install "pandas>=2.2,<4" "numpy>=1.26,<3" "openpyxl>=3.1" "xlrd>=2.0"
      - name: Compile Python
        working-directory: POPIS_4_0
        run: python -m py_compile app.py app_v41.py app_v42.py app_v43.py app_v44.py app_bootstrap.py popis_core.py popis_core_patch.py popis_runtime.py popis_data.py popis_population.py popis_suive_fix.py popis_case_population_fix.py popis_spatial.py

      - name: Test active build wiring
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          bootstrap=Path('app_bootstrap.py').read_text(encoding='utf-8')
          ui=Path('app_v44.py').read_text(encoding='utf-8')
          launcher=Path('INICIAR_POPIS.bat').read_text(encoding='utf-8-sig')
          assert 'app_v44.py' in bootstrap
          assert '4.3.6-territory' in bootstrap
          assert '4.3.6-territory' in ui
          assert '4.3.6-territory' in launcher
          assert '[1000,10000,100000]' in ui
          assert 'Tasa casos del {scope_noun} / población estatal' in ui
          assert 'Razón incidencia {scope_word} / incidencia estatal SINAVE' in ui
          assert 'map_base' in ui and 'how="left"' in ui
          print('ACTIVE BUILD 4.3.6 WIRING OK')
          '@ | Set-Content -Encoding utf8 test_build_wiring.py
          python test_build_wiring.py

      - name: Test real SINAVE edge cases
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          import popis_core as core
          from popis_runtime import activate
          from popis_core_patch import canonical_municipality
          activate()
          df=pd.DataFrame({'Folio':['BOUNDARY','A','B','REJECT'],'Fec_captura':['05/01/2026','05/01/2026','10/01/2026','10/02/2026'],'Fecha_Inicio':['02/01/2026','04/01/2026','09/01/2026','09/02/2026'],'SemanaInicio':[53,1,2,6],'Fec_Primer_Contacto':['04/01/2026','04/01/2026','09/01/2026','09/02/2026'],'Fec_Dx_Final':['15/01/2026','06/01/2026','12/01/2026','12/02/2026'],'Diag_Final':['SALMONELOSIS','NEGATIVO','SHIGELOSIS','SIN DX MUESTRAS RECHAZADAS'],'Salmonella':['POSITIVO','NEGATIVO','NEGATIVO','NEGATIVO'],'Shigella':['NEGATIVO','NEGATIVO','POSITIVO','NEGATIVO'],'Edo_Res':['SONORA']*4,'Mun_Res':['BENITO JUAREZ   SON','ROSARIO SON','HERMOSILLO','HERMOSILLO'],'Calidad_Hiso_Vibrio':['ADECUADA','ADECUADA','ADECUADA','RECHAZO DEFINITIVO']})
          n=core.normalize_sinave(df,'actual')
          assert int(n.loc[n.folio.eq('BOUNDARY'),'epi_year'].iloc[0])==2025
          assert n['sonora_resident'].all(), 'Edo_Res debe reconocer residentes de Sonora'
          assert canonical_municipality('BENITO JUAREZ   SON')=='Benito Juárez' and canonical_municipality('ROSARIO SON')=='Rosario'
          assert core.sinave_summary(n,2026,2)['acumulado']==2 and core.sinave_summary(n,2025,53)['acumulado']==1
          issues=core.quality_issues(n); assert (issues.Tipo=='Cruce de año epidemiológico').any() and (issues.Tipo=='Muestra rechazada').any()
          print('REAL EDGE CASES OK')
          '@ | Set-Content -Encoding utf8 test_real_edges.py
          python test_real_edges.py

      - name: Test duplicate current override
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import io,pandas as pd
          import popis_core as core
          from popis_runtime import activate
          activate(); cols=['Folio','Fec_captura','Fecha_Inicio','SemanaInicio','Diag_Final','Shigella','Edo_Res']
          a=pd.DataFrame([['X','01/06/2026','01/06/2026',23,'','NEGATIVO','SONORA']],columns=cols); b=pd.DataFrame([['X','08/06/2026','01/06/2026',23,'SHIGELOSIS','POSITIVO','SONORA']],columns=cols)
          def f(d): return io.BytesIO(d.to_csv(sep='\t',index=False).encode('latin-1'))
          out=core.combine_sinave([(f(a),'hist.xls'),(f(b),'actual.xls')]); assert len(out)==1 and bool(out.iloc[0]['path_Shigella spp.']) and bool(out.iloc[0]['duplicate_folio_source']) and bool(out.iloc[0]['sonora_resident'])
          print('DUPLICATE OVERRIDE OK')
          '@ | Set-Content -Encoding utf8 test_duplicates.py
          python test_duplicates.py

      - name: Test NuTraVE and laboratory indicators
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          import popis_core as core
          from popis_runtime import activate
          activate()
          df=pd.DataFrame({'Folio':['A','B','C'],'Fec_captura':['02/01/2026','03/01/2026','10/01/2026'],'Fecha_Inicio':['01/01/2026','02/01/2026','09/01/2026'],'SemanaInicio':[1,1,2],'Fec_Primer_Contacto':['01/01/2026','02/01/2026','09/01/2026'],'Fec_Dx_Final':['05/01/2026','05/01/2026','12/01/2026'],'Diag_Final':['NEGATIVO']*3,'NuTraVE':['SI']*3,'Tipo_EDA':['MODERADA','GRAVE','MODERADA'],'Edad_Años':[3,20,None],'MuestraVibrio':['SI']*3,'MuestraEntero':['SI']*3,'MuestraVirus':['SI','NO','SI'],'FecTomaMuestraVibrio':['01/01/2026','02/01/2026','09/01/2026'],'FecTomaMuestraEntero':['01/01/2026','02/01/2026','09/01/2026'],'FecTomaMuestraVirus':['01/01/2026',None,'09/01/2026'],'Fec_Recep_Hiso_Vibrio':['02/01/2026','03/01/2026','10/01/2026'],'Fec_Recep_Hiso_Entero':['02/01/2026','03/01/2026','10/01/2026'],'Fec_Recep_Muest_Virus':['02/01/2026',None,'10/01/2026'],'Calidad_Hiso_Vibrio':['ADECUADA','ADECUADA','RECHAZADA'],'Calidad_Hiso_Entero':['ADECUADA']*3,'Calidad_Muest_Virus':['ADECUADA','','ADECUADA']})
          n=core.normalize_sinave(df,'test')
          ind=core.nutrave_indicators(n,2026,1); rows=ind[ind.Indicador.str.startswith('Muestreo EDA')]
          assert int(rows.iloc[0]['Denominador'])==1 and int(rows.iloc[1]['Denominador'])==1
          lab=core.laboratory_indicators(n,2026,1); rej=lab[lab.Indicador.eq('Muestras rechazadas')].iloc[0]
          assert ('estándar' in rej['Escala']) or ('Alarma' in rej['Escala'])
          print('INDICATORS OK')
          '@ | Set-Content -Encoding utf8 test_indicators.py
          python test_indicators.py

      - name: Test endemic channel
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          from popis_core import endemic_channel
          weekly=pd.DataFrame({'Año':[2022,2023,2024,2025,2026]*2,'SE':[1]*5+[2]*5,'Casos':[10,12,11,9,13,8,9,10,11,12]}); ch=endemic_channel(weekly,2026,[2022,2023,2024,2025],2)
          assert len(ch)==53 and ch.loc[ch.SE.eq(1),'Actual'].iloc[0]==13
          print('CHANNEL OK')
          '@ | Set-Content -Encoding utf8 test_channel.py
          python test_channel.py

      - name: Test population age-sex engine with real coding
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          import popis_core as core
          from popis_runtime import activate
          activate()
          import popis_population as pp
          popraw=pd.DataFrame({'MUN':['Hermosillo']*8,'AÑO':[2026]*8,'SEXO':['HOMBRES','MUJERES']*4,'EDAD_QUIN':['00-04','00-04','05-09','05-09','pobm_65_mm','pobm_65_mm','60-64','60-64'],'POB':[1000,950,1100,1050,600,650,500,550]})
          pop=pp._normalize_frame(popraw,'synthetic')
          assert '65+' in set(pop['Grupo edad'])
          prof=pp.demographic_profile(pop,2026,'Hermosillo'); assert int(prof['Población'])==6400
          pyr=pp.pyramid(pop,2026,'Hermosillo'); assert set(['Hombres','Mujeres']).issubset(pyr.columns)
          sinraw=pd.DataFrame({'Folio':['A','B','C'],'Fec_captura':['05/01/2026']*3,'Fecha_Inicio':['04/01/2026']*3,'SemanaInicio':[1,1,1],'Mun_Res':['Hermosillo']*3,'Edo_Res':['SONORA']*3,'Sexo':['HOMBRE','MUJER','MUJER'],'Edad_Años':[3,67,80],'Diag_Final':['NEGATIVO']*3})
          sin=core.normalize_sinave(sinraw,'test')
          assert sin['sonora_resident'].all()
          rates=pp.age_sex_rates(sin,pop,2026,1,'Hermosillo')
          assert rates['Casos'].sum()==3, rates
          assert rates.loc[rates['Grupo edad'].eq('65+'),'Casos'].sum()==2, rates
          print('POPULATION ENGINE REAL CODING OK')
          '@ | Set-Content -Encoding utf8 test_population.py
          python test_population.py

      - name: Test territorial rate scaling and ratio
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          cases=50; pop_mun=100000; state_cases=500; state_pop=3000000
          expected_ratio=(cases/pop_mun)/(state_cases/state_pop)
          assert round(expected_ratio,6)==3.0
          for base in (1000,10000,100000):
              municipal=cases/pop_mun*base
              state=state_cases/state_pop*base
              contribution=cases/state_pop*base
              assert abs((municipal/state)-3.0)<1e-12
              assert contribution>=0
          print('TERRITORIAL RATE SCALING OK')
          '@ | Set-Content -Encoding utf8 test_territory_rates.py
          python test_territory_rates.py

      - name: Test complete municipality mappings
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          from popis_core_patch import _DISTRICT_BY_MUN, _REGION_BY_MUN
          assert len(_DISTRICT_BY_MUN)==72, len(_DISTRICT_BY_MUN)
          assert len(_REGION_BY_MUN)==72, len(_REGION_BY_MUN)
          assert set(_DISTRICT_BY_MUN)==set(_REGION_BY_MUN)
          print('72 MUNICIPALITY MAPPINGS OK')
          '@ | Set-Content -Encoding utf8 test_municipalities.py
          python test_municipalities.py

      - name: Package POPIS
        shell: pwsh
        run: Compress-Archive -Path POPIS_4_0\* -DestinationPath POPIS_4_3_6_WINDOWS.zip -Force
      - name: Upload POPIS package
        uses: actions/upload-artifact@v4
        with:
          name: POPIS_4_3_6_WINDOWS
          path: POPIS_4_3_6_WINDOWS.zip
          retention-days: 30
