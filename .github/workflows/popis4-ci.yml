name: POPIS 4.0 CI

on:
  pull_request:
    paths:
      - 'POPIS_4_0/**'
      - '.github/workflows/popis4-ci.yml'
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test dependencies
        run: python -m pip install "pandas>=2.2,<4" "numpy>=1.26,<3"
      - name: Compile Python
        working-directory: POPIS_4_0
        run: python -m py_compile app.py app_bootstrap.py popis_core.py popis_core_patch.py
      - name: Build synthetic normalized data
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          from popis_core import normalize_sinave, sinave_summary
          df = pd.DataFrame({
              'Folio':['A','B','C','D'], 'Fec_captura':['02/01/2026','03/01/2026','10/01/2026','11/01/2026'],
              'Fecha_Inicio':['01/01/2026','02/01/2026','09/01/2026','10/01/2026'], 'SemanaInicio':[1,1,2,2],
              'Fec_Primer_Contacto':['01/01/2026','02/01/2026','09/01/2026','10/01/2026'],
              'Fec_Dx_Final':['05/01/2026','15/01/2026','12/01/2026','12/01/2026'],
              'Diag_Final':['NEGATIVO','SHIGELLA','NEGATIVO','NEGATIVO'], 'Shigella':['NEGATIVO','POSITIVO','NEGATIVO','NEGATIVO'],
              'NuTraVE':['SI','SI','SI','SI'], 'Tipo_EDA':['MODERADA','GRAVE','MODERADA','GRAVE'], 'Edad_Años':[3,20,8,None],
              'MuestraVibrio':['SI','SI','SI','SI'], 'MuestraEntero':['SI','SI','SI','SI'], 'MuestraVirus':['SI','NO','NO','SI'],
              'Fec_Recep_Hiso_Vibrio':['02/01/2026','03/01/2026','10/01/2026','11/01/2026'],
              'Fec_Recep_Hiso_Entero':['02/01/2026','03/01/2026','10/01/2026','11/01/2026'],
              'Fec_Recep_Muest_Virus':['02/01/2026',None,None,'11/01/2026'],
              'Calidad_Hiso_Vibrio':['ADECUADA','ADECUADA','ADECUADA','RECHAZADA'], 'Calidad_Hiso_Entero':['ADECUADA','ADECUADA','ADECUADA','ADECUADA'],
          })
          n = normalize_sinave(df, 'test')
          s = sinave_summary(n, 2026, 2)
          assert s['acumulado'] == 4 and s['positivos_acum'] == 1, s
          n.to_pickle('synthetic.pkl')
          '@ | Set-Content -Encoding utf8 test_normalize.py
          python test_normalize.py
      - name: Call NuTraVE indicators
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          from popis_core_patch import nutrave_indicators
          n = pd.read_pickle('synthetic.pkl')
          ind = nutrave_indicators(n, 2026, 1)
          print(ind.to_string(index=False))
          assert len(ind) == 5
          ind.to_pickle('nutrave.pkl')
          '@ | Set-Content -Encoding utf8 test_nutrave_call.py
          python test_nutrave_call.py
      - name: Check under-5 denominator
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          ind = pd.read_pickle('nutrave.pkl')
          row = ind[ind['Indicador'].eq('Muestreo EDA <5 años')].iloc[0]
          print(row.to_dict())
          assert int(row['Denominador']) == 1, row.to_dict()
          '@ | Set-Content -Encoding utf8 test_u5.py
          python test_u5.py
      - name: Check 5-plus denominator
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          ind = pd.read_pickle('nutrave.pkl')
          rows = ind[ind['Indicador'].str.startswith('Muestreo EDA')]
          assert len(rows) == 2, rows.to_dict('records')
          row = rows.iloc[1]
          print(row.to_dict())
          assert int(row['Denominador']) == 2, row.to_dict()
          '@ | Set-Content -Encoding utf8 test_p5.py
          python test_p5.py
      - name: Test laboratory inverse indicator
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          from popis_core_patch import laboratory_indicators
          n = pd.read_pickle('synthetic.pkl')
          lab = laboratory_indicators(n, 2026, 1)
          print(lab.to_string(index=False))
          rej = lab[lab['Indicador'].eq('Muestras rechazadas')].iloc[0]
          assert ('estándar' in rej['Escala']) or ('Alarma' in rej['Escala']), rej.to_dict()
          '@ | Set-Content -Encoding utf8 test_lab.py
          python test_lab.py
      - name: Test endemic channel
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import pandas as pd
          from popis_core import endemic_channel
          weekly = pd.DataFrame({'Año':[2022,2023,2024,2025,2026]*2,'SE':[1]*5+[2]*5,'Casos':[10,12,11,9,13,8,9,10,11,12]})
          ch = endemic_channel(weekly, 2026, [2022,2023,2024,2025], 2)
          assert len(ch) == 53
          assert ch.loc[ch['SE'].eq(1), 'Actual'].iloc[0] == 13
          '@ | Set-Content -Encoding utf8 test_channel.py
          python test_channel.py
      - name: Package POPIS
        if: always()
        shell: pwsh
        run: Compress-Archive -Path POPIS_4_0\* -DestinationPath POPIS_4_0_WINDOWS.zip -Force
      - name: Upload POPIS package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POPIS_4_0_WINDOWS
          path: POPIS_4_0_WINDOWS.zip
          retention-days: 30
