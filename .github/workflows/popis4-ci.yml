name: POPIS 4.0 CI

on:
  pull_request:
    paths:
      - 'POPIS_4_0/**'
      - '.github/workflows/popis4-ci.yml'
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test dependencies
        run: python -m pip install "pandas>=2.2,<4" "numpy>=1.26,<3"
      - name: Compile Python
        working-directory: POPIS_4_0
        run: python -m py_compile app.py app_bootstrap.py popis_core.py popis_core_patch.py
      - name: Synthetic engine smoke test
        id: smoke
        continue-on-error: true
        working-directory: POPIS_4_0
        shell: pwsh
        run: |
          @'
          import traceback
          import pandas as pd
          from popis_core import normalize_sinave, sinave_summary, endemic_channel
          from popis_core_patch import nutrave_indicators, laboratory_indicators

          try:
              print('STAGE 1: build synthetic dataframe')
              df = pd.DataFrame({
                  'Folio':['A','B','C','D'],
                  'Fec_captura':['02/01/2026','03/01/2026','10/01/2026','11/01/2026'],
                  'Fecha_Inicio':['01/01/2026','02/01/2026','09/01/2026','10/01/2026'],
                  'SemanaInicio':[1,1,2,2],
                  'Fec_Primer_Contacto':['01/01/2026','02/01/2026','09/01/2026','10/01/2026'],
                  'Fec_Dx_Final':['05/01/2026','15/01/2026','12/01/2026','12/01/2026'],
                  'Diag_Final':['NEGATIVO','SHIGELLA','NEGATIVO','NEGATIVO'],
                  'Shigella':['NEGATIVO','POSITIVO','NEGATIVO','NEGATIVO'],
                  'NuTraVE':['SI','SI','SI','SI'],
                  'Tipo_EDA':['MODERADA','GRAVE','MODERADA','GRAVE'],
                  'Edad_Años':[3,20,8,None],
                  'MuestraVibrio':['SI','SI','SI','SI'],
                  'MuestraEntero':['SI','SI','SI','SI'],
                  'MuestraVirus':['SI','NO','NO','SI'],
                  'Fec_Recep_Hiso_Vibrio':['02/01/2026','03/01/2026','10/01/2026','11/01/2026'],
                  'Fec_Recep_Hiso_Entero':['02/01/2026','03/01/2026','10/01/2026','11/01/2026'],
                  'Fec_Recep_Muest_Virus':['02/01/2026',None,None,'11/01/2026'],
                  'Calidad_Hiso_Vibrio':['ADECUADA','ADECUADA','ADECUADA','RECHAZADA'],
                  'Calidad_Hiso_Entero':['ADECUADA','ADECUADA','ADECUADA','ADECUADA'],
              })
              print('STAGE 2: normalize SINAVE')
              n = normalize_sinave(df, 'test')
              print(n[['year','epi_week','age_years','pathogen_positive']].to_string(index=False))
              print('STAGE 3: summary')
              s = sinave_summary(n, 2026, 2)
              print('SUMMARY=', s)
              assert s['acumulado'] == 4, s
              assert s['positivos_acum'] == 1, s
              print('STAGE 4: patched indicators')
              ind = nutrave_indicators(n, 2026, 1)
              print(ind.to_string(index=False))
              assert len(ind) == 5
              u5 = ind[ind['Indicador'].eq('Muestreo EDA <5 años')].iloc[0]
              plus5 = ind[ind['Indicador'].eq('Muestreo EDA ≥5 años')].iloc[0]
              assert u5['Denominador'] == 1, u5.to_dict()
              assert plus5['Denominador'] == 2, plus5.to_dict()
              lab = laboratory_indicators(n, 2026, 1)
              print(lab.to_string(index=False))
              rej = lab[lab['Indicador'].eq('Muestras rechazadas')].iloc[0]
              assert 'estándar' in rej['Escala'] or 'Alarma' in rej['Escala'], rej.to_dict()
              print('STAGE 5: endemic channel')
              weekly = pd.DataFrame({'Año':[2022,2023,2024,2025,2026]*2,'SE':[1]*5+[2]*5,'Casos':[10,12,11,9,13,8,9,10,11,12]})
              ch = endemic_channel(weekly, 2026, [2022,2023,2024,2025], 2)
              print(ch.head(3).to_string(index=False))
              assert len(ch) == 53
              print('POPIS core smoke test OK')
          except Exception:
              traceback.print_exc()
              raise
          '@ | Set-Content -Encoding utf8 smoke_test.py
          python smoke_test.py *>&1 | Tee-Object -FilePath smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package POPIS
        if: always()
        shell: pwsh
        run: Compress-Archive -Path POPIS_4_0\* -DestinationPath POPIS_4_0_WINDOWS.zip -Force
      - name: Upload POPIS package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POPIS_4_0_WINDOWS
          path: POPIS_4_0_WINDOWS.zip
          retention-days: 30
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POPIS_4_0_SMOKE_LOG
          path: POPIS_4_0/smoke.log
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce smoke test success
        if: ${{ steps.smoke.outcome != 'success' }}
        shell: pwsh
        run: |
          Write-Error 'POPIS smoke test failed. See POPIS_4_0_SMOKE_LOG artifact.'
          exit 1
